name: Daily PCSO Lotto Scraper

on:
  schedule:
    # Runs everyday at 9:45 PM Philippine Standard Time (13:45 UTC)
    - cron: '45 13 * * *'
  workflow_dispatch: # Keeps the manual run button active

permissions:
  contents: write # Explicitly tells GitHub it is safe to write files

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4
      with:
        persist-credentials: true # Forces GitHub to keep authentication active

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Network Core Requirements
      run: pip install requests

    - name: Run Scraper Script
      run: python scraper.py

    - name: Commit and Push Updated Data Resource
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@://github.com"
        git add data.json
        # The statement below prevents crashing if data.json hasn't changed
        git diff-index --quiet HEAD || (git commit -m "Automated update: Fresh lotto draws synchronization" && git push)
