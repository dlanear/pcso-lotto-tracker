name: Daily PCSO Lotto Scraper

on:
  schedule:
    # Runs everyday at 13:45 UTC (9:45 PM Philippine Standard Time)
    - cron: '45 13 * * *'
  workflow_dispatch: # Allows manual trigger execution button via panel

permissions:
  contents: write # Grants runner write permission to push data.json updates

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Network Core Requirements
      run: pip install requests

    - name: Run Scraper Script
      run: python scraper.py

    - name: Commit and Push Updated Data Resource
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        git add data.json
        git diff-index --quiet HEAD || git commit -m "Automated update: Fresh lotto draws synchronization"
        git push
